# Min override: excludes optional services from min deployment.
# Use with: docker compose -f docker-compose.yaml -f docker-compose.min.yaml up
# (rush docker:up:min)
# Excluded: preview, link-preview, elastic, redis, stats, payment, billing, fulltext_cockroach,
#           print, sign, hulykvs, hulygun, hulypulse, backup-cockroach,
#           backup-api, rating_cockroach
# Overrides below remove dependencies on excluded services so the min project validates.

services:
  preview:
    profiles: ["full"]
  link-preview:
    profiles: ["full"]
  elastic:
    profiles: ["full"]
  redis:
    profiles: ["full"]
  stats:
    profiles: ["full"]
  payment:
    profiles: ["full"]
  billing:
    profiles: ["full"]
  fulltext_cockroach:
    profiles: ["full"]
  print:
    profiles: ["full"]
  sign:
    profiles: ["full"]
  hulykvs:
    profiles: ["full"]
  hulygun:
    profiles: ["full"]
  hulypulse:
    profiles: ["full"]
  backup-cockroach:
    profiles: ["full"]
  backup-api:
    profiles: ["full"]
  rating_cockroach:
    profiles: ["full"]
  account:
    environment:
      - MAIL_URL=${MAIL_URL:-}
      - STATS_URL=
    links: !override []
  workspace_cockroach:
    environment:
      - MAIL_URL=${MAIL_URL:-}
      - STATS_URL=
    links: !override
      - cockroach
      - minio
  collaborator:
    environment:
      - STATS_URL=
    links: !override
      - minio
      - transactor_cockroach
  front:
    environment:
      # VAPID public key; browsers subscribe to push with it (see dev/.env)
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY:-}
      - STATS_URL=
      - PREVIEW_URL=
      - LINK_PREVIEW_URL=
      - PUBLIC_INTEGRATIONS_URL=${PUBLIC_INTEGRATIONS_URL:-http://huly.local:8095}
      - GIF_PROVIDER=${GIF_PROVIDER:-tenor}
      - GIF_API_KEY=${GIF_API_KEY:-}
      # free AI for Ask CeePee: an OpenAI-compatible chat endpoint such as Ollama (http://host.docker.internal:11434)
      - AI_CHAT_URL=${AI_CHAT_URL:-}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-llama3.2}
    links: !override []
  transactor_cockroach:
    environment:
      - MAIL_URL=${MAIL_URL:-}
      - MAIL_API_KEY=${MAIL_API_KEY:-}
      - PUBLIC_FRONT_URL=http://huly.local:8087
      # customer emails link back to the portal
      - PUBLIC_INTEGRATIONS_URL=${PUBLIC_INTEGRATIONS_URL:-http://huly.local:8095}
      # web push: the transactor hands push payloads to the notification service below
      - WEB_PUSH_URL=${WEB_PUSH_URL:-http://notification:8091}
      - MAIL_AUTH_TOKEN=${PUSH_AUTH_TOKEN:-secret}
      - STATS_URL=
    links: !override
      - cockroach
      - minio
      - account
  export:
    environment:
      - STATS_URL=
    links: !override
      - minio
  datalake:
    environment:
      - STATS_URL=
    depends_on: !override
      minio:
        condition: service_healthy
      cockroach:
        condition: service_started
      account:
        condition: service_started

  # CeePee integrations: inbound webhooks (email-to-ticket, Sentry, GitHub/GitLab/Bitbucket, deployments),
  # SCIM provisioning and the daily digest. See pods/integrations/README.md; secrets come from dev/.env.
  integrations:
    image: hardcoreeng/integrations
    restart: unless-stopped
    ports:
      - 8095:8095
    environment:
      - PORT=8095
      - FRONT_URL=http://front:8080
      - ACCOUNTS_URL=http://account:3000
      - PUBLIC_FRONT_URL=http://huly.local:8087
      - WORKSPACE=${INTEGRATIONS_WORKSPACE:-cready}
      - INTEGRATIONS_EMAIL=${INTEGRATIONS_EMAIL:-}
      - INTEGRATIONS_PASSWORD=${INTEGRATIONS_PASSWORD:-}
      - INBOUND_TOKEN=${INBOUND_TOKEN:-}
      - INBOUND_PROJECT=${INBOUND_PROJECT:-}
      - SCIM_TOKEN=${SCIM_TOKEN:-}
      - SCIM_ROLE_MAP=${SCIM_ROLE_MAP:-}
      - SCIM_DEFAULT_ROLE=${SCIM_DEFAULT_ROLE:-USER}
      - MAIL_URL=${MAIL_URL:-}
      - MAIL_API_KEY=${MAIL_API_KEY:-}
      - DIGEST_HOUR=${DIGEST_HOUR:-8}
      - PUBLIC_INTEGRATIONS_URL=${PUBLIC_INTEGRATIONS_URL:-http://huly.local:8095}
      - PORTAL_ENABLED=${PORTAL_ENABLED:-true}
      - PORTAL_NAME=${PORTAL_NAME:-Help centre}
      - PORTAL_COLOR=${PORTAL_COLOR:-#2b6bea}
      - PORTAL_LOGO_URL=${PORTAL_LOGO_URL:-}
      - PORTAL_PROJECT=${PORTAL_PROJECT:-}
      - PORTAL_LANG=${PORTAL_LANG:-en}
      - HEARTBEAT_MINUTES=${HEARTBEAT_MINUTES:-5}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - TEAMS_WEBHOOK_SECRET=${TEAMS_WEBHOOK_SECRET:-}
    depends_on:
      - front
      - account

  # Web push (browser notifications while the tab is closed). Keys: npx web-push generate-vapid-keys,
  # then fill PUSH_PUBLIC_KEY / PUSH_PRIVATE_KEY / PUSH_SUBJECT in dev/.env. The dev keys shipped in .env
  # work on huly.local only; generate your own before going public.
  notification:
    image: hardcoreeng/notification
    restart: unless-stopped
    ports:
      - 8091:8091
    environment:
      - PORT=8091
      - SOURCE=ceepee
      - AUTH_TOKEN=${PUSH_AUTH_TOKEN:-secret}
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY:-}
      - PUSH_PRIVATE_KEY=${PUSH_PRIVATE_KEY:-}
      - PUSH_SUBJECT=${PUSH_SUBJECT:-mailto:admin@ceepee.local}

  # Outbound email (invites, notifications, digest). Start with: docker compose --profile mail up -d
  # after filling SMTP_* (or SES_*) in dev/.env and setting MAIL_URL=http://mail:8097 there.
  mail:
    image: hardcoreeng/mail
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - 8097:8097
    environment:
      - PORT=8097
      - SOURCE=${MAIL_SOURCE:-noreply@ceepee.local}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-upgrade}
      - SES_ACCESS_KEY=${SES_ACCESS_KEY:-}
      - SES_SECRET_KEY=${SES_SECRET_KEY:-}
      - SES_REGION=${SES_REGION:-}

  # GitHub app integration (two-way sync of issues and PRs). Needs a GitHub App:
  # https://docs.github.com/en/apps/creating-github-apps — then fill GITHUB_* in dev/.env and
  # start with: docker compose --profile github up -d   (image built by: rush docker:build --to @hcengineering/pod-github)
  github:
    image: hardcoreeng/github
    profiles: ["github"]
    restart: unless-stopped
    ports:
      - 3078:3078
    environment:
      - PORT=3078
      - ACCOUNTS_URL=http://account:3000
      - APP_ID=${GITHUB_APP_ID:-}
      - CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - COLLABORATOR_URL=http://collaborator:3078
      - SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
